services:
  orchestrator-api:
    build:
      context: ./agents
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    # No hardcoded SEARCH_SVC_URL here, so it uses the one from .env (Cloud Run)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - orchestrator-api
